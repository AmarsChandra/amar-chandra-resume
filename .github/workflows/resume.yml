name: Build resume

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: '0.15.1'
      - name: Install resume font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-crosextra-carlito
      - name: Compile resume
        run: |
          mkdir -p dist
          typst compile resume.typ dist/Amar-Chandra-Resume.pdf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/Amar-Chandra-Resume.pdf
          archive: false
          if-no-files-found: error
          retention-days: 90
